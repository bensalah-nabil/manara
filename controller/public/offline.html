<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>Manara · Hors ligne</title>
<style>
  :root { --bg:#f6f1e6; --ink:#1b2a24; --muted:#5b675f; --brand:#0e5a43; color-scheme: light; font: 17px/1.6 system-ui, 'Segoe UI', Roboto, sans-serif; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a1511; --ink:#ede6d4; --muted:#a9a48d; --brand:#d8b24a; color-scheme: dark; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 1.3rem; margin: 16px 0 6px; }
  p { margin: 4px 0; color: var(--muted); }
  [lang="ar"] { font-family: 'Segoe UI', 'Noto Kufi Arabic', Tahoma, sans-serif; }
  a.retry { display: inline-block; margin-top: 18px; font-weight: 700; padding: 10px 24px; border-radius: 999px; background: var(--brand); color: #fff; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>Pas de connexion</h1>
  <p>La console Manara a besoin d'Internet. Vos règles restent appliquées sur le téléphone de votre enfant.</p>
  <p lang="ar" dir="rtl">لا يوجد اتصال. تحتاج لوحة تحكم منارة إلى الإنترنت، وتبقى قواعدك مطبَّقة على هاتف طفلك.</p>
  <p lang="en">No connection. Your rules keep working on your child's phone.</p>
  <a class="retry" href="/">Réessayer · إعادة المحاولة</a>
</main>
</body>
</html>
