openapi: 3.1.0
info:
  title: Manara API
  version: "1.0.0"
  description: >
    The contract between the Manara agent (child's Android device), the backend
    (central server), and the controller (parent web app). This is the single
    source of truth for all three. Versioned from v1 — never break v1; additive
    changes only, and a breaking change is served as a new /v2 path alongside.

    Two audiences share this spec:
      * /agent/*   — called by the device agent (device-token auth)
      * /console/* — called by the parent controller (parent-session auth)

servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: localhost:8080

tags:
  - name: enrollment
    description: Getting a device under management (device owner).
  - name: agent-sync
    description: The offline-first loop — agent pulls policy/commands, pushes events.
  - name: console
    description: Parent-facing endpoints behind the web controller.

paths:

  # ------------------------------------------------------------------ #
  #  ENROLLMENT                                                         #
  # ------------------------------------------------------------------ #
  /enroll:
    post:
      tags: [enrollment]
      summary: Enroll a device using a one-time enrollment token
      description: >
        The parent generates an enrollment token in the console; it is carried
        to the factory-reset device via the QR provisioning flow. The agent
        exchanges it here for a long-lived device token. A device is always
        visibly managed once enrolled — there is no covert enrollment.
      security: []   # the enrollment token itself is the credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentToken, deviceInfo]
              properties:
                enrollmentToken:
                  type: string
                  description: One-time token from the console.
                deviceInfo:
                  $ref: '#/components/schemas/DeviceInfo'
      responses:
        '200':
          description: Enrolled. Returns the device token and initial policy.
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, deviceToken, policy]
                properties:
                  deviceId: { type: string, format: uuid }
                  deviceToken:
                    type: string
                    description: Long-lived bearer token for /agent/* calls.
                  policy: { $ref: '#/components/schemas/Policy' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------ #
  #  AGENT SYNC LOOP (offline-first)                                    #
  # ------------------------------------------------------------------ #
  /agent/sync:
    post:
      tags: [agent-sync]
      summary: The single round-trip the agent makes on each check-in
      description: >
        One call does the whole loop: the agent reports it is alive (heartbeat),
        uploads any queued events, and receives the current policy plus any
        pending commands. Designed so a flaky connection is safe — event upload
        is idempotent on each event's device-generated id, and commands are
        acked separately so a dropped response never loses one.
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policyVersion, events, commandAcks]
              properties:
                policyVersion:
                  type: integer
                  description: Version of the policy the agent currently holds.
                events:
                  type: array
                  description: Queued observations. May be empty. Idempotent.
                  items: { $ref: '#/components/schemas/Event' }
                commandAcks:
                  type: array
                  description: Ids of commands the agent has now carried out.
                  items:
                    type: object
                    required: [commandId, status]
                    properties:
                      commandId: { type: string, format: uuid }
                      status: { type: string, enum: [acked, failed] }
                      detail: { type: string }
                pushToken:
                  type: string
                  description: >
                    The device's current FCM registration token, if the agent
                    build has Firebase configured. Omitted or empty is not an
                    error -- it just means this device falls back to being
                    reached only on its next /agent/sync poll, same as before
                    push existed. Used only for CommandType.IsUrgent() types
                    (e.g. lock_now) to wake the device immediately instead of
                    waiting for the next poll.
                agentVersion:
                  type: string
                  example: "1.0.11"
                  description: >
                    The Manara version the phone runs now. Stored when valid
                    (up to 32 letters, digits and . + _ -) and shown in the
                    console; older agents omit it.
      responses:
        '200':
          description: Current policy (if changed) and pending commands.
          content:
            application/json:
              schema:
                type: object
                required: [policyChanged, pendingCommands]
                properties:
                  policyChanged:
                    type: boolean
                    description: If true, `policy` holds a newer policy to cache.
                  policy:
                    $ref: '#/components/schemas/Policy'
                  pendingCommands:
                    type: array
                    items: { $ref: '#/components/schemas/Command' }
                  acceptedEventIds:
                    type: array
                    description: Event ids now durably stored; safe to drop locally.
                    items: { type: string, format: uuid }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /agent/setup:
    post:
      tags: [agent-sync]
      summary: Report progress through guided setup
      description: >
        The phone runs a fixed list of setup actions itself and reports each
        step here so the parent can follow along in the console. The server
        only records what the phone says; nothing in the response tells the
        phone what to run. `accounts`, when sent, is the full list of
        accounts now on the phone (types and names only, never passwords).
        The first non-empty list is kept as the starting list for the
        parent's reconnect checklist. Omitting `accounts` leaves both stored
        lists unchanged; an empty array means no accounts are left. Saved
        lists are deleted after 7 days.
      security: [{ deviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, status]
              properties:
                step: { $ref: '#/components/schemas/SetupStep' }
                status: { $ref: '#/components/schemas/SetupStatus' }
                message: { type: string, maxLength: 300 }
                accounts:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/SetupAccount' }
                pairing:
                  description: >
                    Only with step `pairing`: the one-time name and password the
                    console's QR code carries (ADR-0005). Sending one starts a new
                    setup: fresh account lists, no pending code, Finish cleared.
                    Cleared as soon as a report leaves the pairing step.
                  type: object
                  required: [name, password]
                  properties:
                    name: { type: string, pattern: '^manara-[a-z0-9]{4,16}$' }
                    password: { type: string, pattern: '^[A-Za-z0-9]{8,32}$' }
      responses:
        '200':
          description: Stored. The device's setup state after this report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceSetup' }
        '400':
          description: >
            `bad_request` (unreadable body, over 64 KB) or
            `invalid_setup_report` (unknown step or status, `done` step
            without `done` status or the reverse, a field over its limit, or a
            `pairing` outside the pairing step or not matching its patterns).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/setup/input:
    get:
      tags: [agent-sync]
      summary: Read what the parent typed in the console for the step the phone waits at
      description: >
        Polled by the phone during guided setup only (ADR-0005): every input is
        typed in the console so the phone can stay on its Wireless debugging
        screen. `pairingCode` is the latest code the parent sent; `pairingCodeSeq`
        grows with each one so the phone tries every code once. `finish` is set
        once the parent chooses Finish setup while the phone is reconnecting.
      security: [{ deviceToken: [] }]
      responses:
        '200':
          description: The input, empty when there is none.
          content:
            application/json:
              schema:
                type: object
                required: [pairingCodeSeq, finish]
                properties:
                  pairingCode: { type: string, pattern: '^[0-9]{6}$' }
                  pairingCodeSeq: { type: integer, minimum: 0 }
                  finish: { type: boolean }
                  earlierAccounts:
                    type: array
                    description: >
                      What the phone had before an earlier setup run that did not
                      finish (one that failed after accounts were removed). A new
                      run keeps this list and asks the parent to sign back in to
                      all of it; empty once a run has finished.
                    items: { $ref: '#/components/schemas/SetupAccount' }
        '401':
          description: Unknown device token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ------------------------------------------------------------------ #
  #  CONSOLE (parent web app)                                           #
  # ------------------------------------------------------------------ #
  /console/auth/signup:
    post:
      tags: [console]
      summary: Create a parent account
      description: >
        Phase 3's real account model (roadmap.md) — the signup half.
        `cmd/manara-server`'s `-seed` CLI flag remains a separate dev-only
        shortcut, not something this endpoint replaces for everyone.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Account created, already signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: >
            `weak_password`: shorter than 8 characters or longer than 72 bytes
            (bcrypt's limit). Existing passwords are never re-checked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/auth/logout:
    post:
      tags: [console]
      summary: End this session on the server
      description: >
        Revokes the bearer token, so a copied token stops working. Sessions
        also expire after 30 days.
      security: [{ parentSession: [] }]
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console/auth/login/verify:
    post:
      tags: [console]
      summary: Second step of signing in (two-step sign-in on)
      description: >
        When two-step sign-in is on, login and password-reset confirmation
        answer `{twoFactorRequired: true, challenge}` instead of a session.
        Send the challenge with a 6-digit code from the authenticator app
        (each 30-second code works once) or a recovery code (each works once).
        A challenge lives 5 minutes and allows 5 tries.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: "`bad_code`, or `invalid_challenge` (expired or used)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /console/account/two-factor/setup:
    post:
      tags: [console]
      summary: Start turning on two-step sign-in
      description: Needs the password. Returns a new secret and its otpauth URI (for a QR code); not in use until enabled.
      security: [{ parentSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string } } }
      responses:
        '200':
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { type: object, properties: { secret: { type: string }, uri: { type: string } } }
        '403':
          description: "`wrong_password`."

  /console/account/two-factor/enable:
    post:
      tags: [console]
      summary: Turn on two-step sign-in with a first code
      description: Returns 10 recovery codes, shown once; any older ones stop working.
      security: [{ parentSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200':
          description: On.
          content:
            application/json:
              schema: { type: object, properties: { recoveryCodes: { type: array, items: { type: string } } } }
        '400':
          description: "`bad_code`."
        '409':
          description: "`setup_first`: no setup started."

  /console/account/two-factor/disable:
    post:
      tags: [console]
      summary: Turn off two-step sign-in
      description: Needs the password and a current code or a recovery code. Recovery codes are deleted.
      security: [{ parentSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties: { password: { type: string }, code: { type: string } }
      responses:
        '204':
          description: Off.
        '400':
          description: "`bad_code`."
        '403':
          description: "`wrong_password`."

  /console/auth/password-reset:
    post:
      tags: [console]
      summary: Email a password-reset link
      description: >
        Answers 202 for any address, and sends in the background, so neither
        the answer nor its timing tells the caller whether an account exists.
        Only a real account gets an email, at most one per minute. The link is
        `<console>/#reset=<token>`, works for one hour, and only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted; an email goes out if the address has an account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }
        '400':
          description: No email address given.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: "`email_unavailable`: this server has no email provider configured."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/auth/password-reset/confirm:
    post:
      tags: [console]
      summary: Choose a new password from a reset link
      description: >
        Sets the password, uses up the link and every other unused link of the
        account, ends every session of the account, and signs in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password changed; signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400':
          description: >
            `weak_password` (the link stays usable), or `invalid_reset_token`:
            unknown, already used, or older than one hour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/account:
    get:
      tags: [console]
      summary: The signed-in parent's account
      security: [{ parentSession: [] }]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [console]
      summary: Delete the parent account and all its data
      description: >
        Needs the password again. Refused while any phone is still on the
        account: a child's phone managed by an account that no longer exists
        could not be released by anyone. Deletes, in one statement, the parent
        and (by cascade) every device, policy, event, command, session and token.
      security: [{ parentSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: "`wrong_password`. Not 401, which the console reads as an ended session."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "`devices_remain`: release or remove every phone first."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/auth/login:
    post:
      tags: [console]
      summary: Sign in to an existing parent account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console/enrollment-tokens:
    post:
      tags: [console]
      summary: Generate a one-time enrollment token for a new device
      description: >
        The real path a signed-in parent uses to add a device — carried to
        the child's phone via the agent's QR scan or manual-entry
        enrollment screen, then redeemed once at `/enroll`.
      security: [{ parentSession: [] }]
      requestBody:
        required: true
        description: >
          The parent's confirmation that the phone is their own minor child's
          and that the child will be told it is managed (legal-and-ethics.md),
          plus the phone brand chosen for the setup guide. Recorded with the
          token as stated, not verified.
        content:
          application/json:
            schema:
              type: object
              required: [attestation, phoneBrand]
              properties:
                attestation:
                  type: object
                  required: [parentOrGuardian, minorChild, childInformed, version]
                  properties:
                    parentOrGuardian: { type: boolean, description: Must be true. }
                    minorChild: { type: boolean, description: Must be true. }
                    childInformed: { type: boolean, description: Must be true. }
                    version:
                      type: string
                      description: >
                        The wording the parent saw. Must equal the server's
                        current version, otherwise `attestation_outdated`.
                      example: "2026-11-06"
                phoneBrand:
                  type: string
                  enum: [samsung, google, xiaomi, oppo-realme, oneplus, motorola, other]
      responses:
        '200':
          description: A fresh, single-use enrollment token.
          content:
            application/json:
              schema:
                type: object
                required: [enrollmentToken]
                properties:
                  enrollmentToken: { type: string }
        '400':
          description: >
            `attestation_required` (missing body or a statement not confirmed),
            `attestation_outdated`, or `unknown_phone_brand`. No token is issued.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /console/devices:
    get:
      tags: [console]
      summary: List the parent's managed devices with status
      security: [{ parentSession: [] }]
      responses:
        '200':
          description: Devices and their reporting status.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceSummary' }

  /console/devices/{deviceId}/policy:
    get:
      tags: [console]
      summary: Read a device's current policy
      description: >
        Needed to edit one part of a policy without overwriting the rest,
        since `PUT` replaces the whole document. A device with no stored
        policy returns an inert policy at version 0. A device that belongs
        to another parent is `404`, the same as an unknown id.
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: The current policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Policy' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [console]
      summary: Set a device's policy
      description: >
        Replaces the device's policy. Which capabilities collect data is set
        here (location on/off, call log on/off, etc). What cannot be set here:
        turning off the "device is managed" notice — that is not a policy field.
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policy' }
      responses:
        '200':
          description: >
            Stored, and a push asks the phone to fetch it now. `woken` is true
            only when that push really went out (the server has push, the phone
            gave a token, Firebase accepted it); otherwise the phone gets it at
            its next check-in. The console must not send `woken` back.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Policy' }
                  - type: object
                    properties:
                      woken: { type: boolean }

  /console/devices/{deviceId}/commands:
    post:
      tags: [console]
      summary: Queue a command for a device (e.g. lock now)
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { $ref: '#/components/schemas/CommandType' }
                params: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Command queued (pending until the device picks it up).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }

  /console/devices/{deviceId}/events:
    get:
      tags: [console]
      summary: Read a device's reported history (usage, location, calls)
      security: [{ parentSession: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/EventKind' }
        - name: since
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Matching events, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /console/devices/{deviceId}/setup:
    get:
      tags: [console]
      summary: Read a device's guided-setup progress
      description: >
        `null` if the phone never reported a setup step (for example, a
        phone set up before guided setup existed). The console polls this
        while setup is in progress.
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: The latest setup state, or null.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/DeviceSetup' }
                  - { type: 'null' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/devices/{deviceId}:
    delete:
      tags: [console]
      summary: Remove a phone from the account and delete everything stored about it
      description: >
        The phone itself stays managed until it is released (ADR-0004); this
        only removes the server's record, for example after a release by code.
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [console]
      summary: Set the child's name and color for a phone
      description: A field left out keeps its current value. The name is trimmed.
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 40, description: Up to 40 letters; empty clears it. }
                color:
                  type: string
                  enum: ['', teal, blue, purple, pink, red, orange, amber, green]
      responses:
        '200':
          description: Saved, as stored.
          content:
            application/json:
              schema:
                type: object
                required: [label, color]
                properties:
                  label: { type: string }
                  color: { type: string }
        '400':
          description: "`bad_request` or `invalid_profile` (name over 40 letters or with control characters, or an unknown color)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/devices/{deviceId}/setup/pairing-code:
    post:
      tags: [console]
      summary: Send the code the phone's "Pair device with pairing code" screen shows
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: 'Six digits; surrounding spaces are ignored.' }
      responses:
        '202':
          description: Stored; the phone reads it within a few seconds.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        '400':
          description: "`bad_request` or `invalid_pairing_code` (not six digits)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "`setup_not_waiting`: the phone isn't waiting to pair."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/devices/{deviceId}/setup/finish:
    post:
      tags: [console]
      summary: Finish guided setup without waiting for every account to be signed back in to
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '202':
          description: Setup is finished at once, even if the phone is off; the phone stops watching accounts when it next checks.
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "`setup_not_waiting`: the phone isn't at the reconnect step."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /console/devices/{deviceId}/setup/accounts:
    delete:
      tags: [console]
      summary: Delete the saved account lists now instead of after 7 days
      security: [{ parentSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DeviceId' }]
      responses:
        '200':
          description: Both account lists are now empty. The step and status are kept.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared: { type: boolean }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Unknown device, or not this parent's.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

# ==================================================================== #
components:

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: Long-lived token issued at enrollment; identifies one device.
    parentSession:
      type: http
      scheme: bearer
      description: Parent's authenticated session for the console.

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    RateLimited:
      description: >
        `rate_limited`: too many attempts. Login, sign-up, password reset and
        enrollment allow 20 requests per 10 minutes per client; login also
        allows 10 attempts per email per 15 minutes. `Retry-After` says when to
        try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }

    Account:
      type: object
      required: [email, phones, passwordReset]
      properties:
        email: { type: string, format: email }
        phones:
          type: integer
          description: Phones still on the account; deleting it waits until this is 0.
        passwordReset:
          type: boolean
          description: False when the server cannot send email, so a reset link can never arrive.
        twoFactor:
          type: boolean
          description: Two-step sign-in is on.

    AuthResponse:
      type: object
      required: [parentId, parentSession]
      properties:
        parentId: { type: string, format: uuid }
        parentSession:
          type: string
          description: Bearer token for subsequent `/console/*` calls.

    DeviceInfo:
      type: object
      required: [model, androidVersion]
      properties:
        model: { type: string, example: "SM-A546B" }
        manufacturer: { type: string, example: "samsung" }
        androidVersion: { type: string, example: "14" }
        agentVersion: { type: string, example: "0.1.0" }

    DeviceSummary:
      type: object
      required: [deviceId, label, status, lastSeen]
      properties:
        deviceId: { type: string, format: uuid }
        label: { type: string, example: "Aicha's phone", description: "The child's name, as the parent typed it; empty until set." }
        color:
          type: string
          enum: [teal, blue, purple, pink, red, orange, amber, green]
          description: The color the parent picked; absent until one is.
        model: { type: string, example: SM-A045F, description: As the phone reported it at enrollment. }
        manufacturer: { type: string, example: samsung }
        status:
          type: string
          enum: [reporting, not_reporting, never_connected]
          description: not_reporting = missed N heartbeats; shown to the parent.
        lastSeen: { type: string, format: date-time }
        policyVersion: { type: integer }
        agentVersion: { type: string, example: "1.0.11", description: The Manara version on the phone, from its latest check-in; absent until a phone reports one. }

    # ---- Policy ---------------------------------------------------- #
    Policy:
      type: object
      description: >
        The full set of rules for one device. `version` increments on every
        change so the agent can tell when its cache is stale. Note there is no
        "stealth" or "hide notice" field by design.
      required: [version, timeLimits, siteFilter, location, callLog]
      properties:
        version: { type: integer }
        timeLimits:
          type: object
          properties:
            enabled: { type: boolean }
            rules:
              type: array
              items:
                type: object
                required: [category, dailyMinutes]
                properties:
                  category:
                    type: string
                    example: "social"
                  packages:
                    type: array
                    items: { type: string }
                    example: ["com.instagram.android", "com.zhiliaoapp.musically"]
                  dailyMinutes: { type: integer, example: 60 }
        siteFilter:
          type: object
          description: >
            Pins the device's Private DNS to `dnsHost` while `enabled` is true.
            With `enabled` false, or a blank `dnsHost`, the agent hands DNS back
            to the automatic mode and filters nothing. A wrong or unreachable
            host can break the phone's name lookups, which may also stop it
            reaching the server for a corrected policy.
          properties:
            enabled: { type: boolean }
            dnsHost:
              type: string
              description: >
                Private DNS host used to enforce filtering. A bare host name,
                not a URL, port or IP address.
              example: "family.adguard-dns.com"
        location:
          type: object
          properties:
            enabled: { type: boolean }
            intervalMinutes: { type: integer, example: 15 }
        callLog:
          type: object
          description: >
            Not yet enforced by the agent: enabling it currently does nothing.
            Planned as capability-plan.md H3 (sideload builds only).
          properties:
            enabled: { type: boolean }
        lockSchedule:
          type: object
          description: >
            Optional recurring lock windows (e.g. bedtime). Hours are 0-23 in
            the device's own local time. A window whose `toHour` is earlier than
            its `fromHour` runs past midnight and belongs to the day it starts
            on. A window with equal hours never locks the device.
          properties:
            enabled: { type: boolean }
            windows:
              type: array
              items:
                type: object
                properties:
                  days:
                    type: array
                    description: >
                      Day numbers follow java.util.Calendar: Sunday is 1 and
                      Saturday is 7.
                    items: { type: integer, minimum: 1, maximum: 7 }
                    example: [2,3,4,5,6]
                  fromHour: { type: integer, minimum: 0, maximum: 23, example: 22 }
                  toHour: { type: integer, minimum: 0, maximum: 23, example: 7 }
        restrictions:
          type: object
          description: >
            Optional. Closes Settings-level bypasses via device-owner user
            restrictions. Every flag defaults to false; omitting the object
            keeps the previous behaviour.
          properties:
            blockVpnConfig:
              type: boolean
              description: UserManager.DISALLOW_CONFIG_VPN (also stops user VPNs from starting).
            blockPrivateDnsConfig:
              type: boolean
              description: UserManager.DISALLOW_CONFIG_PRIVATE_DNS. Ignored below Android 10 (API 29).
            blockFactoryReset:
              type: boolean
              description: UserManager.DISALLOW_FACTORY_RESET (reset from Settings).
            blockSafeBoot:
              type: boolean
              description: UserManager.DISALLOW_SAFE_BOOT.
            blockAddUser:
              type: boolean
              description: UserManager.DISALLOW_ADD_USER.
            blockDebugging:
              type: boolean
              description: >
                UserManager.DISALLOW_DEBUGGING_FEATURES (developer options, USB and
                wireless debugging). The agent holds it back while guided setup runs,
                since setup itself works over wireless debugging. On by default for a
                new device, with blockFactoryReset, blockSafeBoot and blockAddUser.
        usageReport:
          type: object
          description: >
            Optional, off when omitted. While `enabled`, the phone sends
            `usage_report` events with today's minutes per app. This is data
            leaving the device, so the phone lists it on its own notice and
            status screen while it is on, and the server keeps those events for
            30 days.
          properties:
            enabled: { type: boolean }
        browser:
          type: object
          description: >
            Optional; absent or all off leaves Chrome alone. The phone, as
            device owner, sets Chrome's managed configuration
            (setApplicationRestrictions) using Chrome's own policies:
            ForceGoogleSafeSearch, ForceYouTubeRestrict (1 moderate, 2 strict),
            DnsOverHttpsMode "off", and URLBlocklist. Chrome only; other
            browsers are not covered. The child's status screen lists each rule.
            Refused with 400 `invalid_browser_rules` for an unknown youtube
            value, an empty or whitespace-containing site, or more than 200 sites.
          properties:
            safeSearch: { type: boolean }
            youtube: { type: string, enum: ['off', moderate, strict] }
            secureDnsOff:
              type: boolean
              description: >
                Stops Chrome's own DNS-over-HTTPS, which would otherwise go
                around the site filter's Private DNS host.
            blockedSites:
              type: array
              maxItems: 200
              items: { type: string, maxLength: 253 }
            blockOtherBrowsers:
              type: boolean
              description: >
                Blocks every browser except Chrome, including one installed
                later: any app that offers to open an arbitrary https link.
                Only Chrome can be kept on the site filter. Absent means off.

    # ---- Commands -------------------------------------------------- #
    CommandType:
      type: string
      enum: [lock_now, apply_policy, request_location, ping]

    Command:
      type: object
      required: [commandId, type, status, createdAt]
      properties:
        commandId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/CommandType' }
        params: { type: object, additionalProperties: true }
        status:
          type: string
          enum: [pending, delivered, acked, failed, expired]
        createdAt: { type: string, format: date-time }
        woken:
          type: boolean
          description: >
            In the create response: a push reached the phone, so an urgent
            command runs within seconds. False when the server has no push
            set up or the phone has no push token yet: it runs at the phone's
            next check-in.

    # ---- Events ---------------------------------------------------- #
    EventKind:
      type: string
      description: >
        `enforcement` reports a protection that is not in effect, or that came
        back. Its payload is `{enforcer, status: failed|missing|restored, detail?}`
        and never carries user content.
        `usage_report` is a snapshot of today's minutes per app, sent at most
        about once an hour and only while the policy's `usageReport` is on.
        Its payload is `{date: "YYYY-MM-DD" (the phone's local day),
        totalMinutes, apps: [{package, minutes}]}`, the busiest 30 apps with at
        least one minute. Later snapshots of the same date supersede earlier
        ones. Package names only, no labels and no content.
      enum: [usage, location, call, lock, boot, heartbeat, enforcement, usage_report]

    Event:
      type: object
      description: >
        One observation from the device. `id` is generated ON THE DEVICE so the
        server can dedupe — re-sending the same event is a no-op. This is what
        makes sync safe over a flaky connection.
      required: [id, kind, occurredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/EventKind' }
        occurredAt: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
          description: Shape depends on `kind` (usage sample, lat/lng, call entry...).

    SetupStep:
      type: string
      description: >
        Guided-setup steps, in the order the phone runs them. The parent removes
        the accounts first; apps that hold an account are uninstalled last, since
        their data goes with them.
      enum: [linked, pairing, checking_accounts, waiting_for_accounts, removing_app_accounts,
             device_owner, restoring_apps, reconnecting, done]

    SetupStatus:
      type: string
      description: >
        `waiting_for_parent` means the phone needs the parent to do something
        by hand (remove or re-add accounts). `done` goes only with step `done`.
      enum: [in_progress, waiting_for_parent, failed, done]

    SetupAccount:
      type: object
      description: An account on the phone. Never includes a password.
      required: [type, name]
      properties:
        type: { type: string, minLength: 1, maxLength: 200, example: com.google }
        name: { type: string, maxLength: 200 }

    DeviceSetup:
      type: object
      required: [deviceId, step, status, message, initialAccounts, currentAccounts, startedAt, updatedAt]
      properties:
        deviceId: { type: string, format: uuid }
        step: { $ref: '#/components/schemas/SetupStep' }
        status: { $ref: '#/components/schemas/SetupStatus' }
        message: { type: string }
        initialAccounts:
          type: array
          description: The first account list the phone reported; the reconnect checklist.
          items: { $ref: '#/components/schemas/SetupAccount' }
        currentAccounts:
          type: array
          description: The latest account list the phone reported.
          items: { $ref: '#/components/schemas/SetupAccount' }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        pairingQr:
          type: string
          description: >
            Only while the phone waits to pair: what Android's "Pair device with
            QR code" scans, `WIFI:T:ADB;S:<name>;P:<password>;;`.
        finishRequested:
          type: boolean
          description: The parent chose Finish setup; the run is then already done, and this tells the phone to stop watching accounts.
