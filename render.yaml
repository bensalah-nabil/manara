# Render Blueprint for the Manara API (free plan, for the recette).
# The database is on Neon, and the console on Vercel (controller/vercel.json).
services:
  - type: web
    name: manara-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Neon connection string, asked for when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      # The console's address. A comma-separated list allows several while it moves host;
      # the first is where emailed links point.
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      # Turns on push wake-ups (Lock now within seconds). Add the Firebase service-account
      # key as the Secret File service-account.json; the value is /etc/secrets/service-account.json.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Email through Brevo's HTTPS API (Render's free plan blocks SMTP): password reset
      # and each parent's own alerts. Both off when unset. See backend/README.md.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Render runs Cloudflare in front of every service: CF-Connecting-IP is the real
      # client address, and Cloudflare refuses requests that set it themselves. Rate
      # limits count per client with it; without it every parent shares one count.
      - key: TRUSTED_IP_HEADER
        value: CF-Connecting-IP
